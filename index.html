<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">


</head>

<body>
    <div class="container mt-4">
        <h1 class="text-center">Expense Tracker</h1>


        <div class="card p-3 mt-3">
            <input id="name" class="form-control" type="text" placeholder="Expense Name">
            <input id="amount" class="form-control mt-2" type="number" placeholder="Amount">
            <select id="category" class="form-select mt-2">
                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>
            <input id="date" class="form-control mt-2" type="date">
            <button id="btn" class="btn  mt-2" onclick="saveExpense()">Add Expense</button>
        </div>


        <div class="mt-4">
            <label class="form-label">Filter by Category</label>
            <select id="filter" class="form-select" onchange="showExpenses()">
                <option value="All">All</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>
        </div>


        <table class="table table-bordered mt-3 text-center">
            <thead class="table-info">
                <tr>
                    <th>Name</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="list">
                
            </tbody>
        </table>

        <h4 class="text-end">Total: ₹<span id="total">0</span></h4>
    </div>

  <script src="script.js"></script>

</body>

</html>
